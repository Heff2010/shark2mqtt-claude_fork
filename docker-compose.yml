services:
  shark2mqtt:
    # This fork's published image. There is no "latest" tag: pick a version
    # from https://github.com/users/Heff2010/packages/container/package/shark2mqtt
    image: ghcr.io/heff2010/shark2mqtt:1.5.5-claude.3
    build: .
    env_file: .env
    volumes:
      - shark2mqtt_data:/data
    restart: unless-stopped

volumes:
  shark2mqtt_data:
